name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build all
# platforms and publish a GitHub release. Running the workflow manually builds
# the same artifacts without publishing, which is handy for testing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$crate_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
              exit 1
            fi
            version="$tag_version"
          else
            version="${crate_version}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PKG: hexeditor-${{ needs.prepare.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target && format(',{0}', matrix.extra_target) || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          if [[ -n "${{ matrix.extra_target }}" ]]; then
            cargo build --release --locked --target ${{ matrix.extra_target }}
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/hexeditor" README.md LICENSE \
             assets/hexeditor.desktop assets/icon-256.png "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rm -rf "dist/$PKG"

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package (Debian)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} \
            --deb-version "$VERSION" --output dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/hexeditor.exe" README.md LICENSE "dist/$PKG/"
          (cd dist && 7z a -tzip "$PKG.zip" "$PKG" > /dev/null)
          rm -rf "dist/$PKG"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Hex Editor.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          lipo -create -output "$app/Contents/MacOS/hexeditor" \
            "target/${{ matrix.target }}/release/hexeditor" \
            "target/${{ matrix.extra_target }}/release/hexeditor"

          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z $size $size assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          cp assets/icon.png "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Hex Editor</string>
            <key>CFBundleDisplayName</key><string>Hex Editor</string>
            <key>CFBundleIdentifier</key><string>dev.hexeditor.HexEditor</string>
            <key>CFBundleExecutable</key><string>hexeditor</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature so Apple Silicon will launch the app.
          codesign --force --deep --sign - "$app"

          cp README.md LICENSE dist/
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$PKG.zip"
          # hdiutil is occasionally flaky on CI runners ("Resource busy"); retry.
          for attempt in 1 2 3; do
            hdiutil create -volname "Hex Editor" -srcfolder "$app" -ov -format UDZO "dist/$PKG.dmg" && break
            echo "hdiutil failed (attempt $attempt), retrying..."
            sleep 10
          done
          test -f "dist/$PKG.dmg"
          rm -rf "$app" dist/README.md dist/LICENSE

      - name: List artifacts
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: Hex Editor ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows (x64) | `hexeditor-${{ needs.prepare.outputs.version }}-windows-x86_64.zip` |
            | Windows (ARM64) | `hexeditor-${{ needs.prepare.outputs.version }}-windows-aarch64.zip` |
            | macOS (Apple Silicon + Intel) | `hexeditor-${{ needs.prepare.outputs.version }}-macos-universal.dmg` |
            | Linux (x64) | `hexeditor-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz` or `.deb` |
            | Linux (ARM64) | `hexeditor-${{ needs.prepare.outputs.version }}-linux-aarch64.tar.gz` or `.deb` |

            The macOS app is not notarized: on first launch, right-click it and choose **Open**,
            or run `xattr -dr com.apple.quarantine "/Applications/Hex Editor.app"`.
            Verify downloads with `SHA256SUMS.txt`.
