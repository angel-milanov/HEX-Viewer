version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
      hashes:
        patterns: ["md-5", "sha1", "sha2", "crc32fast"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
